[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "animal_classification"
version = "0.0.1"
description = "Proyecto para clasificacion de imagenes de animales"
authors = [
  { name = " Amir Sadour Gutierrez", email = "a.sadour@uniandes.edu.co" },
  { name = "Camilo Andrés Rodríguez Salamanca ", email = "ca.rodriguezs123@uniandes.edu.co" },
  { name = "Claudia Johana Agudelo Arango", email = "cj.agudelo@uniandes.edu.co" },
  { name = "Luis Gerardo Manrique Cardona ", email = "l.manriquec@uniandes.edu.co" }
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]

requires-python = ">=3.11,<3.14"

[dependency-groups]
production = [
    "fastapi>=0.104.0",
    "pillow>=11.3.0",
    "python-multipart>=0.0.6",
    "uvicorn>=0.24.0",
    "onnxruntime>=1.18.0",
    "numpy>=1.24.0",
]
dev = [
  "black",
  "isort",
  "ruff",
  "torch",
  "torchvision",
  "onnx",
  "onnxruntime-tools",
  "pre-commit",
  "mypy",
  "flake8",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "pyinstaller>=6.16.0",
  "mlflow>=3.4.0",
  "scikit-learn>=1.7.1",
]
notebooks = [
    "imagehash>=4.3.2",
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.5",
    "pandas>=2.3.1",
    "pillow>=11.3.0",
    "pyarrow>=21.0.0",
    "python-multipart>=0.0.6",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "transformers>=4.56.0",
    "uvicorn>=0.24.0",
]

[tool.black]
line-length = 99
include = '\\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["animal_classification"]
force_sort_within_sections = true

[tool.flake8]
ignore = "E731,E266,E501,C901,W503"
max-line-length = 99
exclude = ".git,notebooks,references,models,data"

[tool.ruff]
line-length = 99
select = ["E", "F", "W", "C90", "I"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]




